apiVersion: apps/v1
kind: Deployment
metadata:
  name: blank-website
  labels:
    app: blank-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blank-website
  template:
    metadata:
      labels:
        app: blank-website
    spec:
      containers:
        - name: blank-website
          image: "accountregistryserviceasdkdkas12366.azurecr.io/blank-website:latest"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
