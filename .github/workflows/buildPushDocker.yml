name: Build and Push Docker Image

on:
  workflow_run:
    workflows:
      - Azure Terraform
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ACR_NAME: ${{ vars.ACR_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check required configuration
        shell: bash
        run: |
          for name in ARM_CLIENT_ID ARM_CLIENT_SECRET ARM_TENANT_ID ARM_SUBSCRIPTION_ID ACR_NAME; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Set the $name repository secret or variable."
              exit 1
            fi
          done

      - name: Authenticate to Azure
        uses: ./.github/actions/authentication
        with:
          client_id: ${{ env.ARM_CLIENT_ID }}
          client_secret: ${{ env.ARM_CLIENT_SECRET }}
          tenant_id: ${{ env.ARM_TENANT_ID }}
          subscription_id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Build and push image to Azure Container Registry
        uses: azure/cli@v2
        env:
          ACR_NAME: ${{ env.ACR_NAME }}
        with:
          azcliversion: latest
          inlineScript: |
            az acr build \
              --registry "$ACR_NAME" \
              --image "blank-website:${GITHUB_SHA}" \
              --image "blank-website:latest" \
              .
