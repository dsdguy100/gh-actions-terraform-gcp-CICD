name: Azure Terraform

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      AKS_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      AKS_LOCATION: ${{ vars.AKS_LOCATION }}
      AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
      AKS_NODE_COUNT: ${{ vars.AKS_NODE_COUNT }}
      AKS_NODE_VM_SIZE: ${{ vars.AKS_NODE_VM_SIZE }}
      ACR_NAME: ${{ vars.ACR_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required configuration
        shell: bash
        run: |
          for name in ARM_CLIENT_ID ARM_CLIENT_SECRET ARM_TENANT_ID ARM_SUBSCRIPTION_ID TF_STATE_RESOURCE_GROUP TF_STATE_STORAGE_ACCOUNT TF_STATE_CONTAINER TF_STATE_KEY AKS_RESOURCE_GROUP AKS_LOCATION AKS_CLUSTER_NAME AKS_NODE_COUNT AKS_NODE_VM_SIZE ACR_NAME; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Set the $name repository variable."
              exit 1
            fi
          done

      - name: Authenticate to Azure
        uses: ./.github/actions/authentication
        with:
          client_id: ${{ env.ARM_CLIENT_ID }}
          client_secret: ${{ env.ARM_CLIENT_SECRET }}
          tenant_id: ${{ env.ARM_TENANT_ID }}
          subscription_id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Check Terraform formatting
        run: terraform fmt -check infrastructure/main.tf infrastructure/variables.tf

      - name: Initialize Terraform
        working-directory: infrastructure
        run: |
          terraform init -input=false \
            -backend-config="use_azuread_auth=true" \
            -backend-config="client_id=$ARM_CLIENT_ID" \
            -backend-config="tenant_id=$ARM_TENANT_ID" \
            -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID" \
            -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TF_STATE_CONTAINER" \
            -backend-config="key=$TF_STATE_KEY"

      - name: Validate Terraform
        working-directory: infrastructure
        run: terraform validate -no-color

      - name: Plan Terraform changes
        working-directory: infrastructure
        run: |
          terraform plan -no-color -input=false -out=tfplan \
            -var="resource_group_name=$AKS_RESOURCE_GROUP" \
            -var="location=$AKS_LOCATION" \
            -var="cluster_name=$AKS_CLUSTER_NAME" \
            -var="node_count=$AKS_NODE_COUNT" \
            -var="node_vm_size=$AKS_NODE_VM_SIZE" \
            -var="acr_name=$ACR_NAME"

      - name: Apply Terraform changes
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: infrastructure
        run: terraform apply -auto-approve -input=false tfplan